# PC OBS ingest — RTMP :1935 + HLS :8080
#
# 1. Set WEBHOOK_URL to your deployed Next.js origin (must be reachable from this host).
# 2. Set INGEST_WEBHOOK_SECRET to match the Next.js env var.
# 3. Point DNS live.gameplaylive.com A → this VPS; open ports 1935 + 8080 (or terminate TLS elsewhere).
#
# OBS:
#   Service: Custom
#   Server: rtmp://live.gameplaylive.com/app
#   Stream Key: (from /go-live PC tab)

services:
  rtmp:
    image: tiangolo/nginx-rtmp:latest-2024-09-01
    # Fallback if tag missing — use alfg/nginx-rtmp
    # image: alfg/nginx-rtmp
    ports:
      - "1935:1935"
      - "8080:8080"
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:-http://host.docker.internal:3000/api/streams/ingest}
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:-change-me}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/tmp/hls
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  hls_data:
