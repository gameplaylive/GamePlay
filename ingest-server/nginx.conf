# nginx-rtmp ingest for GamePlay Live OBS / Streamlabs creators.
# OBS Server: rtmp://live.gameplaylive.com/app
# Stream Key: from /go-live → PC tab (unique per Pro account)
#
# on_publish → Next.js /api/streams/ingest → community_live_streams.is_live = true
# on_publish_done → same hook with call=publish_done → is_live = false

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # HLS viewer playback
  server {
    listen 8080;
    server_name _;

    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /tmp;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }

    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    allow publish all;

    application app {
      live on;
      record off;

      # Drop idle publishers
      drop_idle_publisher 10s;

      # HLS for homepage / watch page
      hls on;
      hls_path /tmp/hls;
      hls_fragment 2s;
      hls_playlist_length 10s;
      hls_nested on;

      # Notify GamePlay Live when OBS connects / disconnects.
      # Replace APP_URL + SECRET via docker-compose environment + sed, or edit before deploy.
      on_publish http://host.docker.internal:3000/api/streams/ingest;
      on_publish_done http://host.docker.internal:3000/api/streams/ingest;
    }
  }
}
