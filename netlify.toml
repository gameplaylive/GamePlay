# Next.js on Netlify (OpenNext).
# Publish must NOT be the repo root — Netlify UI was setting that and breaking the plugin.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled syncs (Netlify Scheduled Functions — not vercel.json).
# Requires site env: CRON_SECRET (same value the /api/* cron routes expect).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Schedules are also exported from each function's `config.schedule`.
# YouTube live: every 20m · Twitch: every 3m · Trending: every 6h · Favorites/reminders: every 10m
[functions."cron-sync-youtube"]
  schedule = "*/20 * * * *"

[functions."cron-sync-twitch"]
  schedule = "*/3 * * * *"

[functions."cron-sync-trending"]
  schedule = "0 */6 * * *"

[functions."cron-check-favorites"]
  schedule = "*/10 * * * *"

[functions."cron-process-reminders"]
  schedule = "*/10 * * * *"

